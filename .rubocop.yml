# There is no .rubocop_todo.yml. Every cop is either enabled and clean, or ruled off
# below with the reason attached -- a generated TODO would let an exemption re-enter
# as a silent line in a file nobody reads.

# Without this, the AllCops/Exclude below REPLACES RuboCop's default exclude
# list (tmp/, vendor/, node_modules/) rather than adding to it, and the build
# artifacts under tmp/ get linted.
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-thread_safety
  - rubocop-yard

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  # `spike/` is throwaway research: one-off probes, and fixtures deliberately
  # shaped to be *matched* by a structural-search experiment rather than to read
  # well. Linting it fails commits over code nobody intends to keep, and `.rspec`
  # already fences the same directory off with its `spike: true` tag filter.
  Exclude:
    - "spike/**/*"

# Our docstrings read `@param name [Type] description`, so the name comes BEFORE the
# type. AutoCorrect is off deliberately: the cop's fix for an undocumented argument
# writes `@param name [Object]` with no description, which inflates `yard stats`
# coverage with a tag that says nothing. The offense is worth reporting -- a method
# documenting six of nine parameters reads as if the list were complete -- but the
# repair is a sentence a human writes, so `rubocop -a` must not paper over it.
YARD/MismatchName:
  EnforcedStylePrototypeName: before
  AutoCorrect: false

# These classes are REOPENED -- `Foo = Data.define(...)` and then `class Foo` for the
# constants and nested classes a `Data.define` block cannot hold (they would scope to the
# enclosing module; the trap `Request::SYSTEM_PREFIX` documents). Each is documented at its
# definition, which this cop cannot see because it judges one node at a time.
#
# A comment on the reopen is not an option: YARD attaches it to the same namespace and keeps
# the LAST docstring, so any comment here -- prose, `:nodoc:`, even a `rubocop:disable`
# directive -- becomes the published class documentation and DISCARDS the real one. That was
# the live defect this list exists to have fixed, not a hypothetical.
#
# Listed by name rather than excluded by path so the cop keeps guarding everything else in
# these files. Only names that appear ONCE in lib/ are listed: a reopened class whose bare
# name recurs (Input, Report, Decision, Outcome, Entry, Call, Reply) would blind the cop
# repo-wide, so those files carry their documentation on the reopen instead.
#
# Three of those -- Tool::Input, Tools::Subagent, Frontend::Completion -- are split for
# Metrics/ClassLength rather than the Data.define trap, so BOTH halves are `class` keywords
# the cop inspects and the bare one cannot be a `casgn` it skips. Each carries a SAME-LINE
# `# rubocop:disable Style/Documentation` instead. That works only because the real doc sits
# on the LATER half: YARD does read a trailing comment as a docstring, and last one wins, so
# moving the documentation back above the first half would publish the directive text as the
# class's documentation. If you move it, delete the directive in the same edit.
Style/Documentation:
  AllowedConstants:
    - CacheProfile
    - Classification
    - Conductor
    - Consolidation
    - DualLedger
    - Epics
    - Fault
    - Gates
    - HumanReplies
    - Improvement
    - Instrumentation
    - Intent
    - IssueTransition
    - Keepsake
    - Layer
    - LineEditor
    - ModeState
    - Occupancy
    - Persona
    - Poisoned
    # Not a Data.define: `Approval::Gate::Policy` is a real class reopened for its
    # subclass family, so BOTH occurrences are `class` keywords the cop judges
    # independently and one of them must go bare. The only other `Policy` in lib/
    # (Capability::Policy) is documented, so listing the name costs nothing today.
    - Policy
    - PromptComposer
    - Request
    - RequestReview
    - Resolution
    - Ruling
    - SessionClosed
    - Shutdown
    - SpawnPolicy
    - TTY
    - Usage
    - WorkerHandoff

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec describe/context blocks are legitimately long; the cop measures the DSL,
# not complexity. `spec/support` holds shared example groups, which are the same
# DSL wearing a different name.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"
    - "spec/support/**/*.rb"
    - "*.gemspec"

Layout/LineLength:
  Max: 120

# Keyword arguments are self-describing at the call site, so they do not carry
# the legibility cost that motivates this cop for positional parameters. Value
# objects with many named fields are exactly the intended shape here.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The CLI assembly classes (Wiring, ChatLaunch) legitimately run long: their
# length is many small, named wire-ups of ONE responsibility -- assembling a
# chat's collaborators -- not a hidden second concern the cop would otherwise
# flag. Domain and value objects stay well under, so a long one there still
# signals a missing object. A modest ceiling keeps that signal while not
# forcing an artificial split of a cohesive assembler.
Metrics/ClassLength:
  Max: 110

# In the middleware idiom the block IS the downstream app, and `&app` says so.
# Anonymous `&` forwarding would save six characters and cost the reader the one
# name that explains the shape.
Naming/BlockForwarding:
  EnforcedStyle: explicit

# Joel's `{ effect:, context: }` in tool_runner.rb is the style we want everywhere a
# hash value merely repeats its key -- `always` is the only shorthand setting that
# actually enforces it (`either`/`either_consistent` tolerate the old form). Vendored
# HTTP code keeps upstream shape, so it is excluded from this cop specifically.
Style/HashSyntax:
  EnforcedShorthandSyntax: always
  Exclude:
    - "lib/lain/provider/http/**/*"

# --- RSpec cops ruled OFF deliberately -------------------------------------
#
# These live here rather than in .rubocop_todo.yml on purpose. The TODO is a work
# queue, and an entry that will never be burned down makes the queue lie about its
# own size. Each of these is a decision with a reason, so it belongs in config.

# `expect(x).to eq(x)` reads as a tautology to the AST, and here it is usually the
# point: this bench asserts purity, determinism, memoization and idempotent folds,
# and every one of those looks identical on both sides. Sampled five sites across
# five unrelated subsystems -- `driver.report == driver.report` (byte-identical
# reports), `replay(over:) == replay(over:)` (determinism, named in the example),
# `backend.eager` under `be` (memoized, built once per run), `log.to_a == log.to_a`
# (the fold consumed nothing), and `ANTHROPIC == ANTHROPIC` (Data equality) -- and
# all five were deliberate. The cop cannot distinguish "asserts a pure function is
# pure" from "forgot what to assert". RSpec/NoExpectationExample is the cop that
# actually catches an example asserting nothing, and it stays on.
RSpec/IdenticalEqualityAssertion:
  Enabled: false

# Group-level locals here are build-once values read (never mutated) by examples:
# anonymous stand-in classes, fixture paths, and registry-derived data. In
# `algebra_laws_spec.rb` the local also GENERATES the examples, which `let` cannot
# do -- `let` does not exist at class-definition time. Rebuilding an anonymous
# Class per example would be strictly worse. The trade this makes is real: a spec
# that mutates a shared local gets cross-example bleed and the cop would have said
# so. House style is deeply-frozen read-only values, so that trade is consistent.
RSpec/LeakyLocalVariable:
  Enabled: false

# The same argument Metrics/BlockLength already makes above: these cops measure the
# RSpec DSL, not complexity. A 40-line example is usually one Gherkin-shaped
# scenario, and splitting an example to satisfy a counter buys nothing and costs the
# scenario its name. CLAUDE.md's "never loosen a Metrics/* limit" is about lib/
# objects, where a tripped cop means a missing collaborator; counting `expect` calls
# in a spec is not that. `@ivar`-over-`let` (InstanceVariable) is a 341-site house
# style, not a defect, and describing a PROPERTY by string rather than a class
# (DescribeClass) is exactly what output_discipline_spec.rb and its kin are for.
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false

# --- Performance cops ruled OFF for a named site ---------------------------

# Both of these examples have an explicit fold AS their subject. usage_spec asserts
# the monoid folds the same in any order, and strategy_spec's own comment names
# `inject(:+)` as the shape that invited a deep-copy bug. `sum` gives the same answer
# and hides the fold being tested, so the spec would stop exercising what it
# documents. The populations are 4 and a generated sample; the allocation is noise.
Performance/Sum:
  Exclude:
    - "spec/lain/compaction/strategy_spec.rb"
    - "spec/lain/usage_spec.rb"

# `&method(:keep)` names the collaborator; the block form repeats the argument to say
# less. This runs once per human prompt read, so the Method allocation the cop is
# counting is not on any hot path.
Performance/MethodObjectAsBlock:
  Exclude:
    - "lib/lain/cli/composed_prompt.rb"

# --- ThreadSafety: audited sites, kept ON for everything else ---------------
#
# These cops stay enabled because their VALUE is the next site, not this list: a
# new class-level ivar or a new Thread.new now has to be argued for. Every entry
# below was read once, and the exclusion is the verdict.

# All of these are class-level memoization of immutable, idempotently-computed
# values: Algebra and Reline registries, ActiveModel::Name, the shipped prompt
# templates read off disk, a digest format String, and Tool/Contracts declarations.
# Two shapes, both safe. The declaration-time ones (tool.rb's @input_model,
# contracts.rb's @own_pre/postconditions, input.rb's @fields) run inside a class
# body, so they are single-threaded by construction. The lazy `||=` ones are warmed
# during `require` -- Algebra.registry, for instance, is reached from the `refute`
# calls sitting in class bodies in purge_failed_inputs.rb and summarizing.rb, so the
# memo is populated before any thread exists. Where one could still race, both
# racers compute an equal frozen value and one is discarded: wasted work, not
# corruption.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - "exe/lain"
    - "lib/lain/algebra.rb"
    - "lib/lain/compaction/summary_snapshot.rb"
    - "lib/lain/frontend/completion.rb"
    - "lib/lain/frontend/reline.rb"
    - "lib/lain/guard.rb"
    - "lib/lain/prompt/slots.rb"
    - "lib/lain/provider/http/configuration.rb"
    - "lib/lain/provider/http/streaming.rb"
    - "lib/lain/tool.rb"
    - "lib/lain/tool/contracts.rb"
    - "lib/lain/tool/input.rb"
    - "spec/support/algebra_generators.rb"

# The six deliberate threads, and they now have two legitimate owners.
#
# Five are the frontend's: the neovim RPC drain/resend pair and its rpc_thread, the
# TTY reader, the notifier, and prompt_breaker's watchdog -- each a supervised reader
# owned by the one layer allowed to own the terminal.
#
# The sixth is the provider transport's stall clock, and it is the first thread in lib/
# outside frontend/ and cli/. It is there because a stalled stream is observable only by
# ABSENCE: no chunk arrives, so no callback fires, and the request thread that would
# notice is the very thing blocked in the socket read. A timer thread is the only
# observer left. It is owned end to end -- started on the first body byte, joined in the
# clock's own ensure, touching no state outside its instance mutex -- and it is named per
# request, so a survivor in a watchdog dump says which request it was watching.
#
# Specs spawn threads to TEST concurrency -- channel_spec's drop-oldest races are the
# subject, not an accident -- so spec/ is excluded wholesale.
ThreadSafety/NewThread:
  Exclude:
    - "lib/lain/cli/prompt_breaker.rb"
    - "lib/lain/frontend/neovim.rb"
    - "lib/lain/frontend/neovim/rpc_thread.rb"
    - "lib/lain/frontend/tty.rb"
    - "lib/lain/notify.rb"
    - "lib/lain/provider/http/streaming/faraday_handlers.rb"
    - "spec/**/*"

# `rake pspec` forks one process per core (parallel_tests), so a spec's Dir.chdir is
# process-local and not the cross-thread hazard this cop assumes. It stays ON for
# lib/, where a chdir would be exactly that hazard.
ThreadSafety/DirChdir:
  Exclude:
    - "spec/**/*"

# --- Doubles: the four ducks that cannot be verified -----------------------
#
# Everything else converted (51 of 76 sites). These four are the residue, and each
# is a case where verifying the double would defeat the example.
#
# journal_spec's `double("io without #fsync")` is the sharpest: the example asserts
# the Journal skips fsync on an IO that LACKS it, so verifying against ::IO -- which
# has fsync -- would test the opposite of what it says. chat_launch's
# chronicle_factory and prompt_composer's renderer are callables (`->(**) {}`, `#call`)
# with no class to verify against, and repl_delivery's `outcome` is whatever
# Conductor#supervise hands back, named structurally rather than by type.
RSpec/VerifiedDoubles:
  Exclude:
    - "spec/lain/cli/chat_launch_spec.rb"
    - "spec/lain/frontend/prompt_composer_spec.rb"
    - "spec/lain/journal_spec.rb"
    - "spec/lain/repl_delivery_spec.rb"

# Every one of these stubs a class the spec never constructs: Socket#connect built
# inside Vsock#start, Faraday::Retry::Middleware#sleep built inside Faraday's stack,
# and File#fsync built inside the WAL. There is no seam to inject through without
# reshaping production code to suit a test, so any_instance is the honest tool here.
# The cop stays on, because reaching for it against one of OUR classes is the real
# smell it catches -- that is a collaborator wanting injection.
RSpec/AnyInstance:
  Exclude:
    - "spec/lain/core/transport/vsock_spec.rb"
    - "spec/lain/provider/anthropic_spec.rb"
    - "spec/lain/provider/bedrock_spec.rb"
    - "spec/lain/provider/response_wal_spec.rb"
    - "spec/lain/session_record/salvage_spec.rb"

# --- Assertion shape ------------------------------------------------------

# The cop's premise is that a spy avoids arranging an expectation before the act.
# That premise does not hold for any of the sites here, because the mock semantics
# ARE the assertion: `.ordered` pairs pinning that /keep journals the head BEFORE the
# popup opens, `.once.and_call_original` on a real collaborator pinning a memoized
# build, and negatives like `expect(File).not_to receive(:open)` -- which cannot be a
# spy at all, since allowing File.open to record it changes the behaviour under test.
# Converting these would trade a precise assertion for a looser one.
RSpec/MessageSpies:
  Enabled: false

# Three helpers hold the expectation for their callers: `refuses` (rewind_spec),
# `refute_workspace_key` (workspace_spec), and `wait_until`, which RAISES on timeout
# (neovim_runtime_spec.rb:59) and so fails the example with a description of the
# editor state. Defaults are restated because AllowedPatterns replaces rather than
# merges. support_vsock_availability_spec is a META-spec: it builds a nested example
# group whose `it("probe")` deliberately asserts nothing, and the OUTER example
# asserts on whether that probe ran.
RSpec/NoExpectationExample:
  AllowedPatterns:
    - "^expect_"
    - "^assert_"
    - "^refute"
    - "^refuses"
    - "^wait_until"
  Exclude:
    - "spec/support_vsock_availability_spec.rb"

# Table-driven examples: two loops over a model-to-window Hash generate bodies that
# are identical ASTs closing over different data. The cop compares the body, so a
# data-driven pair always reads as a repeat.
RSpec/RepeatedExample:
  Exclude:
    - "spec/lain/context_window_spec.rb"

# The literal IS the subject: `expect { expect(42).to be_valid_ndjson }` asserts the
# matcher refuses an argument that is neither an IO nor a String.
RSpec/ExpectActual:
  Exclude:
    - "spec/support_matchers_spec.rb"

# Each iteration carries its own failure message ("#{name}: deferring is a refusal,
# not a soft yes"), which names the offending skill. `all` reports the collection and
# loses which paragraph failed.
RSpec/IteratedExpectation:
  Exclude:
    - "spec/lain/skill/shipped_skills_spec.rb"

# --- Spec layout and grouping ---------------------------------------------

# `include_examples` INLINES the shared examples into the calling group;
# `it_behaves_like` nests them in a child. This codebase depends on the difference
# and says so in two places (strategy_spec.rb's header, algebra_generators.rb): a
# config Hash written in a group body closes over `self` = the example group, where
# no `let` exists yet. algebra_laws_spec.rb proves it -- the line after the include
# reads `examples.map(&:description)` to learn which laws the shared group just
# defined, and under `it_behaves_like` those examples belong to a child group, so it
# reads the wrong set. Converting all 44 sites turned that file red. The example
# COUNT is identical either way, so a green suite cannot vouch for the other 43.
RSpec/IncludeExamples:
  Enabled: false

# A spec file is named for the concept it covers, not by mirroring a class path. Some
# describe one member of a subsystem (approval_spec covers Approval::Queue,
# pipeline_source_spec covers its Null), some describe a relationship rather than a
# class (core/grep_parity_spec pins the Rust and Ruby greps against each other), and
# spec/integration/ is a deliberate second tree. Renaming 30 files to satisfy a
# mirror rule would cost every one of those names its meaning. It also folds a
# `describe Klass, "scope"` docstring into the expected FILENAME, so it cannot both
# be on and leave RSpec/DescribeMethod (below) off.
RSpec/SpecFilePathFormat:
  Enabled: false

# A fixture project that deliberately holds a spec-shaped file NOT named *_spec.rb,
# so the grader's own discovery has a negative case to find.
RSpec/SpecFilePathSuffix:
  Exclude:
    - "spec/fixtures/**/*"

# One file per concept, which sometimes covers two collaborating classes: btw_spec
# holds /btw and /keep, registry_spec holds the registry and Command::Env. Nesting a
# describe of a DIFFERENT class inside the first would misreport where each example
# lives.
RSpec/MultipleDescribes:
  Enabled: false

# `describe Klass, "streaming"` names the SCOPE under test, and RSpec composes it
# into the full description. The cop wants only `#method`/`.class`, which cannot say
# "the streaming path of this provider".
RSpec/DescribeMethod:
  Enabled: false

# The digits are domain labels, not sequence indices: s1/s2/s3 and m1/m2/m3 are the
# short and medium SESSIONS whose turn counts the comment above them tabulates, and
# after_v1/after_v2 are the index states after writing version 1 and version 2.
# Renaming them would delete the mapping to the fixture data they stand for.
RSpec/IndexedLet:
  Exclude:
    - "spec/lain/memory/index_spec.rb"
    - "spec/lain/plan/calibration_spec.rb"

# describe class -> describe method -> context when -> context with is four levels and
# reads correctly. Raised one step rather than flattening a nesting that carries
# meaning; this cop counts DSL depth, not complexity, so CLAUDE.md's Metrics/* rule
# (a tripped cop means a missing object) does not transfer.
RSpec/NestedGroups:
  Max: 4

# `stub_const` cannot express a constant's ABSENCE, and the example needs exactly
# that: a host whose Ruby was built without Socket::AF_VSOCK. It removes and restores
# the real constant in an ensure.
RSpec/RemoveConst:
  Exclude:
    - "spec/support_vsock_availability_spec.rb"

# `task build: :compile` adds a prerequisite to the `build` task bundler/gem_tasks
# already defined and described. A `desc` here would retitle someone else's task.
Rake/Desc:
  Exclude:
    - "Rakefile"
