inherit_from: .rubocop_todo.yml

# Without this, the AllCops/Exclude below REPLACES RuboCop's default exclude
# list (tmp/, vendor/, node_modules/) rather than adding to it, and the build
# artifacts under tmp/ get linted.
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-thread_safety

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  # `spike/` is throwaway research: one-off probes, and fixtures deliberately
  # shaped to be *matched* by a structural-search experiment rather than to read
  # well. Linting it fails commits over code nobody intends to keep, and `.rspec`
  # already fences the same directory off with its `spike: true` tag filter.
  Exclude:
    - "spike/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec describe/context blocks are legitimately long; the cop measures the DSL,
# not complexity. `spec/support` holds shared example groups, which are the same
# DSL wearing a different name.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"
    - "spec/support/**/*.rb"
    - "*.gemspec"

Layout/LineLength:
  Max: 120

# Keyword arguments are self-describing at the call site, so they do not carry
# the legibility cost that motivates this cop for positional parameters. Value
# objects with many named fields are exactly the intended shape here.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The CLI assembly classes (Wiring, ChatLaunch) legitimately run long: their
# length is many small, named wire-ups of ONE responsibility -- assembling a
# chat's collaborators -- not a hidden second concern the cop would otherwise
# flag. Domain and value objects stay well under, so a long one there still
# signals a missing object. A modest ceiling keeps that signal while not
# forcing an artificial split of a cohesive assembler.
Metrics/ClassLength:
  Max: 110

# In the middleware idiom the block IS the downstream app, and `&app` says so.
# Anonymous `&` forwarding would save six characters and cost the reader the one
# name that explains the shape.
Naming/BlockForwarding:
  EnforcedStyle: explicit

# Joel's `{ effect:, context: }` in tool_runner.rb is the style we want everywhere a
# hash value merely repeats its key -- `always` is the only shorthand setting that
# actually enforces it (`either`/`either_consistent` tolerate the old form). Vendored
# HTTP code keeps upstream shape, so it is excluded from this cop specifically.
Style/HashSyntax:
  EnforcedShorthandSyntax: always
  Exclude:
    - "lib/lain/provider/http/**/*"

# --- RSpec cops ruled OFF deliberately -------------------------------------
#
# These live here rather than in .rubocop_todo.yml on purpose. The TODO is a work
# queue, and an entry that will never be burned down makes the queue lie about its
# own size. Each of these is a decision with a reason, so it belongs in config.

# `expect(x).to eq(x)` reads as a tautology to the AST, and here it is usually the
# point: this bench asserts purity, determinism, memoization and idempotent folds,
# and every one of those looks identical on both sides. Sampled five sites across
# five unrelated subsystems -- `driver.report == driver.report` (byte-identical
# reports), `replay(over:) == replay(over:)` (determinism, named in the example),
# `backend.eager` under `be` (memoized, built once per run), `log.to_a == log.to_a`
# (the fold consumed nothing), and `ANTHROPIC == ANTHROPIC` (Data equality) -- and
# all five were deliberate. The cop cannot distinguish "asserts a pure function is
# pure" from "forgot what to assert". RSpec/NoExpectationExample is the cop that
# actually catches an example asserting nothing, and it stays on.
RSpec/IdenticalEqualityAssertion:
  Enabled: false

# Group-level locals here are build-once values read (never mutated) by examples:
# anonymous stand-in classes, fixture paths, and registry-derived data. In
# `algebra_laws_spec.rb` the local also GENERATES the examples, which `let` cannot
# do -- `let` does not exist at class-definition time. Rebuilding an anonymous
# Class per example would be strictly worse. The trade this makes is real: a spec
# that mutates a shared local gets cross-example bleed and the cop would have said
# so. House style is deeply-frozen read-only values, so that trade is consistent.
RSpec/LeakyLocalVariable:
  Enabled: false

# The same argument Metrics/BlockLength already makes above: these cops measure the
# RSpec DSL, not complexity. A 40-line example is usually one Gherkin-shaped
# scenario, and splitting an example to satisfy a counter buys nothing and costs the
# scenario its name. CLAUDE.md's "never loosen a Metrics/* limit" is about lib/
# objects, where a tripped cop means a missing collaborator; counting `expect` calls
# in a spec is not that. `@ivar`-over-`let` (InstanceVariable) is a 341-site house
# style, not a defect, and describing a PROPERTY by string rather than a class
# (DescribeClass) is exactly what output_discipline_spec.rb and its kin are for.
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false

# --- Performance cops ruled OFF for a named site ---------------------------

# Both of these examples have an explicit fold AS their subject. usage_spec asserts
# the monoid folds the same in any order, and strategy_spec's own comment names
# `inject(:+)` as the shape that invited a deep-copy bug. `sum` gives the same answer
# and hides the fold being tested, so the spec would stop exercising what it
# documents. The populations are 4 and a Rantly sample; the allocation is noise.
Performance/Sum:
  Exclude:
    - "spec/lain/compaction/strategy_spec.rb"
    - "spec/lain/usage_spec.rb"

# `&method(:keep)` names the collaborator; the block form repeats the argument to say
# less. This runs once per human prompt read, so the Method allocation the cop is
# counting is not on any hot path.
Performance/MethodObjectAsBlock:
  Exclude:
    - "lib/lain/cli/composed_prompt.rb"

# --- ThreadSafety: audited sites, kept ON for everything else ---------------
#
# These cops stay enabled because their VALUE is the next site, not this list: a
# new class-level ivar or a new Thread.new now has to be argued for. Every entry
# below was read once, and the exclusion is the verdict.

# All of these are class-level memoization of immutable, idempotently-computed
# values: Algebra and Reline registries, ActiveModel::Name, the shipped prompt
# templates read off disk, a digest format String, and Tool/Contracts declarations.
# Two shapes, both safe. The declaration-time ones (tool.rb's @input_model,
# contracts.rb's @own_pre/postconditions, input.rb's @fields) run inside a class
# body, so they are single-threaded by construction. The lazy `||=` ones are warmed
# during `require` -- Algebra.registry, for instance, is reached from the `refute`
# calls sitting in class bodies in purge_failed_inputs.rb and summarizing.rb, so the
# memo is populated before any thread exists. Where one could still race, both
# racers compute an equal frozen value and one is discarded: wasted work, not
# corruption.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - "exe/lain"
    - "lib/lain/algebra.rb"
    - "lib/lain/compaction/summary_snapshot.rb"
    - "lib/lain/frontend/completion.rb"
    - "lib/lain/frontend/reline.rb"
    - "lib/lain/guard.rb"
    - "lib/lain/prompt/slots.rb"
    - "lib/lain/provider/http/configuration.rb"
    - "lib/lain/provider/http/streaming.rb"
    - "lib/lain/tool.rb"
    - "lib/lain/tool/contracts.rb"
    - "lib/lain/tool/input.rb"
    - "spec/support/algebra_generators.rb"

# The five deliberate threads: the neovim RPC drain/resend pair and its rpc_thread,
# the TTY reader, the notifier, and prompt_breaker's watchdog. Each is a supervised
# reader owned by the frontend, which is the one layer allowed to own the terminal.
# Specs spawn threads to TEST concurrency -- channel_spec's drop-oldest races are the
# subject, not an accident -- so spec/ is excluded wholesale.
ThreadSafety/NewThread:
  Exclude:
    - "lib/lain/cli/prompt_breaker.rb"
    - "lib/lain/frontend/neovim.rb"
    - "lib/lain/frontend/neovim/rpc_thread.rb"
    - "lib/lain/frontend/tty.rb"
    - "lib/lain/notify.rb"
    - "spec/**/*"

# `rake pspec` forks one process per core (parallel_tests), so a spec's Dir.chdir is
# process-local and not the cross-thread hazard this cop assumes. It stays ON for
# lib/, where a chdir would be exactly that hazard.
ThreadSafety/DirChdir:
  Exclude:
    - "spec/**/*"

# --- Doubles: the four ducks that cannot be verified -----------------------
#
# Everything else converted (51 of 76 sites). These four are the residue, and each
# is a case where verifying the double would defeat the example.
#
# journal_spec's `double("io without #fsync")` is the sharpest: the example asserts
# the Journal skips fsync on an IO that LACKS it, so verifying against ::IO -- which
# has fsync -- would test the opposite of what it says. chat_launch's
# chronicle_factory and prompt_composer's renderer are callables (`->(**) {}`, `#call`)
# with no class to verify against, and repl_delivery's `outcome` is whatever
# Conductor#supervise hands back, named structurally rather than by type.
RSpec/VerifiedDoubles:
  Exclude:
    - "spec/lain/cli/chat_launch_spec.rb"
    - "spec/lain/frontend/prompt_composer_spec.rb"
    - "spec/lain/journal_spec.rb"
    - "spec/lain/repl_delivery_spec.rb"

# Every one of these stubs a class the spec never constructs: Socket#connect built
# inside Vsock#start, Faraday::Retry::Middleware#sleep built inside Faraday's stack,
# and File#fsync built inside the WAL. There is no seam to inject through without
# reshaping production code to suit a test, so any_instance is the honest tool here.
# The cop stays on, because reaching for it against one of OUR classes is the real
# smell it catches -- that is a collaborator wanting injection.
RSpec/AnyInstance:
  Exclude:
    - "spec/lain/core/transport/vsock_spec.rb"
    - "spec/lain/provider/anthropic_spec.rb"
    - "spec/lain/provider/bedrock_spec.rb"
    - "spec/lain/provider/response_wal_spec.rb"
    - "spec/lain/session_record/salvage_spec.rb"
