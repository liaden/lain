[package]
name = "lain-core"
version = "0.1.0"
edition = "2024"
authors = ["Joel Johnson <johnson.joel.b@gmail.com>"]
license = "MIT"
publish = false

[[bin]]
name = "lain-core"
path = "src/main.rs"

[dependencies]
# The async runtime: net (the relay's listeners), time (its devices reread tick), signal
# (SIGTERM/SIGINT shut the runtime down through its Drop glue). Out-of-process by the placement
# rule -- an async runtime never runs inside a magnus FFI call (ext/lain/CLAUDE.md).
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
# The msgpack-RPC server this binary hosts.
lain-rpc = { path = "../lain-rpc", version = "0.1.0" }
# Dynamically-typed msgpack values, the shape every handler answers with.
rmpv = "1.3"
# Diagnostics. NEVER stdout/stderr -- the crate root denies both; the writer is
# a file path given by argv, /dev/null when absent (the Journal-interleaving
# wound stays closed).
tracing = "0.1"
# `default-features = false` because the default `ansi` feature pulls
# `nu-ansi-term` and makes the fmt layer read `NO_COLOR` to decide colour --
# the terminal-ownership rule in `ext/lain/CLAUDE.md` ("no crate here may own,
# drive, or interrogate a terminal ... none may read the environment to decide
# colour"), which is workspace-wide and binds the daemon too: it is a separate
# process with no business holding a tty. `deny.toml`'s
# ban on `nu-ansi-term` is the mechanical half; `main.rs`'s `.with_ansi(false)`
# is the stated half. Features unify across the workspace's single lock file,
# so the ban only holds if BOTH crates opt out. `fmt` (+ its `registry`), `std` and
# `smallvec` are the rest of `default`, named back because this crate's
# subscriber is a plain `fmt()` to a file -- no `json`, no `env-filter`.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
  "smallvec",
] }
# Idiomatic std::error::Error + Display derives for the relay's start error.
thiserror = "2"
# The relay's messages, pinned with the phone's client.
lain-wire = { path = "../lain-wire", version = "0.1.0" }
serde = "1"
# The relay's token check: the guess's digest against each paired device's, in
# constant time, so its timing tells a peer neither which device nor how much of a guess matched.
subtle = "2.6"
blake3 = "1"
# `getifaddrs` without unsafe, to find this host's tailscale0 address, and
# `O_NOFOLLOW` (`fs`), so the devices file is never read through a symlink.
nix = { version = "0.31", default-features = false, features = ["fs", "net"] }

[dev-dependencies]
lain-rpc = { path = "../lain-rpc", version = "0.1.0", features = ["test-support"] }
# Tempdir-scoped test sockets and scratch files, auto-cleaned.
tempfile = "3"
# `process` for tests/lifecycle.rs, the only code that spawns a process: it
# drives the real binary to observe argv and signal handling. `io-util` for the
# tests' `AsyncReadExt`/`AsyncWriteExt`; the daemon itself never needs it.
# `test-util` for paused time, so the 5 s auth deadline is tested without a 5 s wait.
tokio = { version = "1.53", features = ["process", "io-util", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The relay confines itself after binding, without unsafe here.
landlock = "0.4.7"

[target.'cfg(target_os = "macos")'.dependencies]
blake3 = { version = "1", features = ["pure"] }
