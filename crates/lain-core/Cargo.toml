[package]
name = "lain-core"
version = "0.1.0"
edition = "2024"
authors = ["Joel Johnson <johnson.joel.b@gmail.com>"]
license = "MIT"
publish = false

[[bin]]
name = "lain-core"
path = "src/main.rs"

[dependencies]
# The async runtime the wire runs on: net (UnixListener/UnixStream, and the
# test-only TCP listener), time (the accept retry pause), sync (the
# per-connection response mpsc), signal (SIGTERM/SIGINT shut the runtime
# down through its Drop glue). Out-of-process by the placement rule -- an async runtime
# never runs inside a magnus FFI call (ext/lain/CLAUDE.md).
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
# `codec::{Decoder, Encoder}` + `Framed`: incremental decode over the socket.
# msgpack is self-delimiting, so there is no framing to invent -- the Decoder
# just retries `rmpv::decode::read_value` until the buffer holds a whole value.
tokio-util = { version = "0.7", features = ["codec"] }
# `StreamExt`/`SinkExt` + `Framed::split`, so one task reads frames while
# another writes responses (the out-of-order completion contract).
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Dynamically-typed msgpack values. The wire shape is the 4-element msgpack-RPC
# array the Neovim client already speaks; `Value` keeps the envelope handling
# schema-free.
rmpv = "1.3"
# `BytesMut`/`Buf`/`BufMut` for the codec's receive buffer (tokio-util's codec
# API is written in terms of it).
bytes = "1.12"
# Diagnostics. NEVER stdout/stderr -- the crate root denies both; the writer is
# a file path given by argv, /dev/null when absent (the Journal-interleaving
# wound stays closed).
tracing = "0.1"
# `default-features = false` because the default `ansi` feature pulls
# `nu-ansi-term` and makes the fmt layer read `NO_COLOR` to decide colour --
# the terminal-ownership rule in `ext/lain/CLAUDE.md` ("no crate here may own,
# drive, or interrogate a terminal ... none may read the environment to decide
# colour"), which is workspace-wide and binds the daemon too: it is a separate
# process with no business holding a tty. `deny.toml`'s
# ban on `nu-ansi-term` is the mechanical half; `main.rs`'s `.with_ansi(false)`
# is the stated half. Features unify across the workspace's single lock file,
# so the ban only holds if BOTH crates opt out. `fmt` (+ its `registry`), `std` and
# `smallvec` are the rest of `default`, named back because this crate's
# subscriber is a plain `fmt()` to a file -- no `json`, no `env-filter`.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
  "smallvec",
] }
# Idiomatic std::error::Error + Display derives for the request error enum;
# its Display text is the RPC error string a client sees.
thiserror = "2"

[dev-dependencies]
# Tempdir-scoped test sockets and scratch files, auto-cleaned.
tempfile = "3"
# `process` for tests/lifecycle.rs, the only code that spawns a process: it
# drives the real binary to observe argv and signal handling. `io-util` for the
# tests' `AsyncReadExt`/`AsyncWriteExt`; the daemon itself never needs it.
tokio = { version = "1.53", features = ["process", "io-util"] }
