# Runs lain natively in a Linux VM on macOS, so bwrap, Landlock and lain-fence all have a real kernel.
# Start it from the repo root: limactl start lima/lain.yaml. See docs/users/lima.md.
minimumLimaVersion: 1.1.0

vmType: vz
cpus: 4
memory: 8GiB
disk: 60GiB

images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64

# Two writable mounts and no home mount: a writable mount nested in a read-only one breaks bwrap's binds.
mountType: virtiofs
mounts:
  - location: "~/dev/lain"
    mountPoint: /mnt/lain
    writable: true
  - location: "~/tmp/lain"
    mountPoint: /mnt/lain-tmp
    writable: true

env:
  TMPDIR: /mnt/lain-tmp
  # Guest-local, so the VM's build never overwrites the Mac's target/release/.
  CARGO_TARGET_DIR: /var/lib/lain-target

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      install -d -o "$LIMA_CIDATA_USER" /var/lib/lain-target
      /mnt/lain/bin/ci/install-spec-binaries --persist
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      /mnt/lain/bin/ci/install-toolchain
