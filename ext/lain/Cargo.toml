[package]
name = "lain"
version = "0.1.0"
edition = "2024"
authors = ["Joel Johnson <johnson.joel.b@gmail.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8.2" }
tracing = "0.1"
# `default-features = false` to drop `ansi`, which is the whole point of the
# line: that feature pulls `nu-ansi-term` AND makes the fmt layer's default
# colour decision `env::var("NO_COLOR")` -- a crate in this process reading the
# environment to decide how RUBY's stream should look, and emitting ESC bytes
# mid-line into an NDJSON experiment record if it guesses colour. `deny.toml`
# cannot express a feature ban, so it bans `nu-ansi-term` BY NAME instead --
# `ansi = ["fmt", "nu-ansi-term"]` is the only edge that pulls it, which makes
# the crate ban a feature ban by proxy. `init_tracing`'s `.with_ansi(false)`
# then states the same property in code, and survives another workspace member
# re-unifying the feature.
#
# Dropping the defaults also drops `tracing-log`, and that IS an intentional
# instrumentation change rather than a no-op: `log` is in this crate's graph
# (`ast-grep-language -> ignore -> globset -> log`), and with that feature on,
# `try_init` installs `LogTracer` (`util.rs:43`), so `ignore`/`globset`'s
# internal `log` records became `tracing` events and landed in the Journal as
# experiment record. They are not experiment record -- this crate's own spans
# are, and they are emitted through `tracing` directly and unaffected. The
# bridge goes; nothing we author stops being logged.
# The rest of `default` is named back explicitly: `fmt` (+ its
# `registry`) is the subscriber, `std` its allocator/thread story, `smallvec`
# its per-span field storage. `json` and `env-filter` were already the reason
# this dep is here at all.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "json",
  "env-filter",
  "std",
  "smallvec",
] }
# Used only for `dup(2)` so the tracing subscriber can own an independent copy
# of a caller-supplied fd. Pinned (not `*`) to satisfy `cargo deny`'s wildcard
# ban.
libc = "0.2"
# Canonical's content-addressing hash. The one and only blake3 implementation
# in this project -- Ruby calls into this ext rather than carrying a second,
# separately-vendored copy of the algorithm.
blake3 = "1"
# Persistent HAMT backing the Store's content-addressed map. NOTE: its
# distinguishing feature -- O(1) structural sharing *between map versions* --
# is LATENT today, not yet exploited. The Store mutates one map in place and no
# Timeline retains a prior version, so the current O(1) `fork` and
# stored-once-shared-prefix properties actually come from the handle design
# (`fork` returns self) plus content-addressing (dedup by digest), which a plain
# `HashMap` would also give. The sharing earns its place once speculative
# branching carries a per-branch immutable snapshot so discarded beams never
# touch the shared store (see ROADMAP Rust-rule #2 / the M4 speculative work).
# Chosen over `im`, which has a soundness-advisory history `cargo deny`/`audit` flag.
rpds = "1"
# In-memory BM25 retrieval for Memory::Bm25. Pure data-structure work (an
# inverted index + sparse embeddings over owned `HashMap`s), so it lives
# in-process here rather than in the out-of-process core. `default-features =
# false` drops the crate's `default_tokenizer` (and with it `cached`,
# `stop-words`, `rust-stemmers`, `deunicode`): we supply our own deterministic
# `SurfaceTokenizer`, which keeps the dep tree to `bm25 -> fxhash -> byteorder`
# (all MIT/Apache) and -- load-bearing -- keeps `cached`'s interior mutability
# unreachable so the wrapped index is honestly `frozen_shareable`. Pinned exact
# (not `*`) to satisfy `cargo deny`'s wildcard ban; v2.x is MIT.
bm25 = { version = "=2.3.2", default-features = false }
# Insertion-ordered map used while canonicalizing an object: keys are collected
# in wire order, a second occurrence of a collapsed key is the ambiguous-key
# error, and `sort_keys` then gives the deterministic ordering `Canonical.dump`
# requires. Deterministic iteration is exactly the sorted-key stability the
# prompt cache depends on.
indexmap = "2"
# Idiomatic `std::error::Error` + `Display` derive for the pure error enums
# (CanonError, BuildError). Their Display text is the FFI-visible message a
# later card wires the raise sites to, so hand-rolling `impl Display` for two
# enums is exactly what the derive replaces.
thiserror = "2"
# Structural (AST) code search. `ast-grep-core` parses an in-memory `&str` and
# matches metavariable patterns against the CST with ZERO filesystem access, so
# the matcher is pure data-structure work and lives in-process here -- only
# recursive file-walking (the `ignore`-backed CLI path) is I/O-shaped and would
# belong out of process. `ast-grep-language` supplies the ~26 bundled
# tree-sitter grammars behind `SupportLang`. The core Rust API is explicitly
# unstable across minors, so both are pinned EXACT (`=0.44.1`) and the whole
# surface is wrapped behind `astgrep.rs` + locked by golden tests. (Trimming the
# grammar set to the four languages we use is a filed follow-up, not this dep.)
ast-grep-core = "=0.44.1"
ast-grep-language = "=0.44.1"
# tree-sitter query engine (Query/QueryCursor) for the raw-query tool. The
# grammars are reused from ast-grep-language via SupportLang::get_ts_language()
# -- NO separate grammar deps. Pinned EXACT to the version ast-grep-language
# already resolves (=0.26.11) so the Language ABI matches its bundled grammars.
tree-sitter = "=0.26.11"
# Style VALUE TYPES for the prompt formatter -- `Style`, `AnsiColor`,
# `Ansi256Color`, `RgbColor`, `Effects` -- and their `Display` renderers. Chosen
# over `console`/`termcolor`/`owo-colors` for one reason that is a rule, not a
# preference: `anstyle` has ZERO runtime dependencies and reads NO environment.
# `NO_COLOR`, `FORCE_COLOR`, `isatty` and `TERM` are properties of the stream
# RUBY owns, so color arrives here as a resolved argument and the renderer
# stays the pure `(format, vars, color) -> String` that `Context#render`'s
# purity rule wants. A crate that decides color for us would be deciding it
# from the wrong process.
anstyle = "1"
# TOML config parsing for `Lain::Ext::Prompt.from_toml`. `from_str` ONLY -- Ruby
# reads the file, so no I/O crosses into this crate; the source arrives as a
# String. Paired with `serde`'s derive because the config is a typed struct
# (`format` plus an optional `[settings]` table), not a free-form map: an
# unknown top-level key is then a loud deserialize error rather than a silently
# ignored typo.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
serde = { version = "1", features = ["derive"] }
# Display-column width for the rendered prompt, so the line editor's cursor
# arithmetic is right in front of an emoji or a CJK glyph. 0.2's `str` width is
# NOT the sum of its `char` widths (ZWJ sequences, variation selectors), which
# is exactly the correction we need and the reason the version floor matters.
# `no_std`, zero dependencies.
unicode-width = "0.2"
# fzf-quality fuzzy matching for completion, headless. Upstream-documented as
# "purely functional with no I/O or threading", and its whole dependency set is
# `memchr` + `unicode-segmentation` -- which is the reason it is here rather
# than `skim`, whose LIBRARY crate installs a `#[global_allocator]` and
# hard-depends on `crossterm`/`tokio`/`ratatui`. Ruby owns the terminal; we want
# the matcher, not a picker. MPL-2.0 is this workspace's first non-permissive
# licence and is already allowed in `deny.toml`.
#
# `unicode-segmentation` is in the crate's `default` set; it is named EXPLICITLY
# because it is not cosmetic -- it is what makes `chars::graphemes` collapse a
# cluster to one index, and therefore what makes the match positions we hand
# Ruby line up with `String#grapheme_clusters`. If upstream ever drops it from
# `default`, this line is what keeps the index space from silently shifting.
nucleo-matcher = { version = "0.3.1", features = ["unicode-segmentation"] }
# UAX#29 grapheme segmentation, so `fuzzy.rs` can build its own haystack instead
# of `Utf32Str::new`. That constructor is not index-space stable: for a string
# that is not ASCII but whose grapheme-leading chars all are (`"ne\u{301}on"`),
# it falls back to `Ascii(str.as_bytes())` and starts reporting BYTE offsets
# where it otherwise reports grapheme indices -- verified, and it would have
# mis-highlighted every accented candidate. Building the buffer ourselves gives
# one index space unconditionally. Already in the tree (nucleo-matcher's own
# `unicode-segmentation` feature pulls it), so this adds no transitive
# dependency and no new licence.
unicode-segmentation = "1"
