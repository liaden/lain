# Lines labelled by how many regions each must report. The digests are the shapes a trial
# read back as secrets; the secrets are the shapes that must survive the digest rule. Hex
# values are slices of sha512 over a fixed word, frozen here.
# A vendor-shaped value is written as parts the spec joins, because a push scanner matches the
# whole token and refuses a push that carries one, fake or not.
