# commit-msg is not a default stage, so it only installs when named here. Anyone
# cloning fresh gets both hook types from a single `pre-commit install`; an
# existing checkout needs one `pre-commit install` re-run to pick up commit-msg.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: '\.rs$'
      - id: check-merge-conflict
      - id: check-yaml
      # A .patch file's whitespace is load-bearing: a blank context line in a diff is a
      # single trailing space, and stripping it corrupts the patch's applicability.
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: trailing-whitespace
        exclude: '\.patch$'

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: '^\.envrc$'

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

      # cargo-deny refreshes its advisory-db by shelling out to `git -C <db> reset
      # --hard`. In a linked git worktree, `git commit` exports GIT_DIR/GIT_INDEX_FILE
      # into the hook environment, and those OVERRIDE `-C`, so the reset silently
      # discards *this* worktree's staged changes and the commit dies with "files were
      # modified by this hook". Strip them for this hook so the reset lands on the
      # advisory-db clone as intended. A no-op outside a worktree, where they are unset.
      - id: cargo-deny
        name: cargo deny
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE cargo deny check
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml)$

      # pre-commit runs hooks serially, so rubocop and rspec overlap INSIDE one
      # hook: `rake check` is a multitask fanning them out together, after the
      # one compile both need (`rspec` cannot load `lain` until the Rust
      # extension is built). rspec itself runs parallel_rspec, one worker per
      # core. Touching either language re-runs the lot; rubocop now checks the
      # whole repo (cached) rather than staged filenames, the same scope
      # `rake default` and CI use.
      - id: ruby-checks
        name: ruby checks (rubocop + rspec, parallel)
        entry: bundle exec rake compile check
        language: system
        types_or: [ruby, rust]
        pass_filenames: false

      # The doc defects RuboCop cannot reach, because they are properties of the
      # registry YARD BUILDS rather than of any one file: two files documenting one
      # namespace (YARD keeps a single docstring and discards the rest, silently),
      # and a docstring separated from its method by an intervening constant or
      # attr_reader, which lands the @param tags on that instead. The second kind
      # was hiding Compaction::Source's entire eleven-tag constructor docstring on
      # an attr_reader.
      #
      # `--staged` rather than whole-tree on purpose: 58 duplicate-namespace cases
      # predate this hook, and gating every commit on clearing them first would
      # block work that has nothing to do with them. Staged mode holds new work to
      # the standard from today and lets the backlog be cleared on its own terms.
      # `types: [ruby]` keeps it out of the way of commits touching no Ruby.
      - id: yard-lint
        name: yard-lint (staged ruby files)
        entry: bundle exec yard-lint --staged
        language: system
        types: [ruby]
        pass_filenames: false

      # Was a spec globbing planning/specs/*.md, which made prose part of the
      # test surface: one bad block turned `rake pspec` red for everyone, and
      # each new doc moved the example count this repo reads to detect a
      # truncated parallel run. Staged files only, so the signal reaches the
      # person editing the document rather than the next person to commit.
      - id: gherkin-docs
        name: gherkin blocks (staged plan docs)
        entry: bin/lint-gherkin-docs
        language: script
        files: '^planning/specs/.*\.md$'

      # Deterministic commit-message lint (no gem load, no network, no AI): the
      # mechanical parts of the git-commit-narrative standard. Runs at commit-msg
      # so it sees the final message; pass_filenames hands it COMMIT_EDITMSG.
      - id: lint-commit-msg
        name: lint commit message
        entry: bin/lint-commit-msg
        language: script
        stages: [commit-msg]
