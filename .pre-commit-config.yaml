# commit-msg is not a default stage, so it only installs when named here. Anyone
# cloning fresh gets both hook types from a single `pre-commit install`; an
# existing checkout needs one `pre-commit install` re-run to pick up commit-msg.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: '\.rs$'
      - id: check-merge-conflict
      - id: check-yaml
      # A .patch file's whitespace is load-bearing: a blank context line in a diff is a
      # single trailing space, and stripping it corrupts the patch's applicability. A
      # .msgpack fixture is bytes that often look like text, and a fixer's newline breaks
      # the round-trip test that compares them. A toml-test case's missing newline or trailing
      # space is the input it tests.
      - id: end-of-file-fixer
        exclude: '\.(patch|msgpack)$|^spec/fixtures/toml-test/'
      - id: trailing-whitespace
        exclude: '\.(patch|msgpack)$|^spec/fixtures/toml-test/'

  # language: golang, so pre-commit fetches its own Go where none is installed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Relative links and heading anchors in the living docs (lychee.toml: offline, so
  # no commit waits on a network). The inputs are named here and not passed by
  # pre-commit: a renamed heading breaks links in files the commit did not touch.
  # Left out on purpose: planning/ and references/ (records), CHANGELOG.md,
  # CODE_OF_CONDUCT.md (not our text), and the prompt templates under lib/ and
  # dogfood/ (prompts, not docs).
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        files: '\.md$'
        pass_filenames: false
        args: [--config, lychee.toml, README.md, CLAUDE.md, CONTRIBUTING.md, DEBUGGING.md, ROADMAP.md,
               IDEAS.md, docs, examples, "crates/*/README.md", "plugin/*/README.md", "apps/*/README.md",
               "apps/*/CLAUDE.md", ext/lain/README.md, ext/lain/CLAUDE.md, ext/lain/mutants-survivors.md,
               lib/lain/provider/http/VENDOR.md]

  # The house writing style as prose rules (.vale.ini, styles/Lain/). An error
  # fails the commit; verbose is what lets a warning print on a passing run.
  # Every page is checked on any docs or rule change, because a rule edit can
  # fail a page the commit did not touch. The rule books (CLAUDE.md), ROADMAP.md
  # and IDEAS.md are link-checked above but are not held to the prose rules.
  # agent-state-machine.md is generated. language: golang, so pre-commit builds
  # vale itself.
  - repo: https://github.com/errata-ai/vale
    rev: v3.27.0
    hooks:
      - id: vale
        files: '^(\.vale\.ini|styles/.*|(README|CONTRIBUTING|DEBUGGING)\.md|(docs|examples)/.*\.md|(crates|plugin|apps)/[^/]+/README\.md|ext/lain/README\.md)$'
        pass_filenames: false
        verbose: true
        args: ["--glob=!docs/devs/agent-state-machine.md", README.md, CONTRIBUTING.md, DEBUGGING.md,
               docs, examples, crates/lain-daemon/README.md, crates/lain-fence/README.md,
               crates/lain-rpc/README.md, crates/lain-wire/README.md, plugin/herdr/README.md,
               plugin/nvim/README.md, plugin/tmux/README.md, apps/lain-remote/README.md,
               ext/lain/README.md]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: '^\.envrc$'

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        exclude: ^apps/
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        exclude: ^apps/
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        exclude: ^apps/
        pass_filenames: false

      # The phone app is a workspace of its own, so the cargo hooks above never see it.
      # These name its manifest, and run when it or the wire it speaks changes.
      - id: remote-fmt
        name: cargo fmt (lain-remote)
        entry: cargo fmt --manifest-path apps/lain-remote/Cargo.toml -- --check
        language: system
        pass_filenames: false
        files: ^apps/lain-remote/

      - id: remote-clippy
        name: cargo clippy (lain-remote)
        entry: cargo clippy --manifest-path apps/lain-remote/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(apps/lain-remote/|crates/lain-wire/)

      # A missing relay binary skips these tests green, so the hook builds it and turns a skip into a failure.
      - id: remote-test
        name: cargo test (lain-remote)
        entry: >-
          env LAIN_REMOTE_REQUIRE_RELAY=1 sh -c
          'cargo build -q -p lain-daemon && cargo test --manifest-path apps/lain-remote/Cargo.toml'
        language: system
        pass_filenames: false
        files: ^(apps/lain-remote/|crates/lain-(wire|rpc|daemon)/|Cargo\.(toml|lock)$)

      # Its own deny config, for the reason the cargo-deny hook below gives for stripping git's variables.
      - id: remote-deny
        name: cargo deny (lain-remote)
        entry: >-
          env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE
          cargo deny --manifest-path apps/lain-remote/Cargo.toml --config apps/lain-remote/deny.toml check
        language: system
        pass_filenames: false
        files: ^(apps/lain-remote/(Cargo\.(toml|lock)|deny\.toml)|deny\.toml)$

      # cargo-deny refreshes its advisory-db by shelling out to `git -C <db> reset
      # --hard`. In a linked git worktree, `git commit` exports GIT_DIR/GIT_INDEX_FILE
      # into the hook environment, and those OVERRIDE `-C`, so the reset silently
      # discards *this* worktree's staged changes and the commit dies with "files were
      # modified by this hook". Strip them for this hook so the reset lands on the
      # advisory-db clone as intended. A no-op outside a worktree, where they are unset.
      - id: cargo-deny
        name: cargo deny
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE cargo deny check
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml)$

      # pre-commit runs hooks serially, so rubocop and rspec overlap INSIDE one
      # hook: `rake check` is a multitask fanning them out together, after the
      # one compile both need (`rspec` cannot load `lain` until the Rust
      # extension is built). rspec itself runs parallel_rspec, one worker per
      # core. Touching either language re-runs the lot; rubocop now checks the
      # whole repo (cached) rather than staged filenames, the same scope
      # `rake default` and CI use. The daemon is built here too: the suite runs
      # :daemon examples whenever a lain-daemon binary exists, so a stale one
      # from before a protocol change reds them for a reason the commit lacks.
      - id: ruby-checks
        name: ruby checks (rubocop + rspec, parallel)
        entry: bundle exec rake compile daemon:build check
        language: system
        types_or: [ruby, rust]
        # The phone app's Rust never reaches this suite: the app never touches Ruby, and its own unit
        # tests are the check for a change inside it. lain-daemon and lain-rpc are NOT excluded:
        # the :daemon and :core specs drive them, and daemon-tier below runs those tags on them.
        exclude: ^apps/
        pass_filenames: false

      # The suite excludes :core and skips :daemon without their binaries, so a Rust or Ruby change
      # under the daemon would pass ruby-checks having run neither. LAIN_REQUIRE_BINARIES makes a
      # missing binary a failure here.
      - id: daemon-tier
        name: daemon tier (:core and :daemon specs)
        entry: env LAIN_REQUIRE_BINARIES=1 sh -c 'bundle exec rake compile daemon:build && bundle exec rspec --tag core --tag daemon'
        language: system
        files: ^(crates/lain-(rpc|daemon|wire)/|Cargo\.(toml|lock)$|Rakefile$|lib/lain/(core|daemon)(\.rb|/)|lib/lain/approval/remote_surface\.rb|lib/lain/paths/shipped\.rb|spec/lain/(daemon_spec\.rb|daemon/|core/|approval/remote_surface_spec\.rb)|spec/support/(lain_daemon|tags)\.rb)
        pass_filenames: false

      # The doc defects RuboCop cannot reach, because they are properties of the
      # registry YARD BUILDS rather than of any one file: two files documenting one
      # namespace (YARD keeps a single docstring and discards the rest, silently),
      # and a docstring separated from its method by an intervening constant or
      # attr_reader, which lands the @param tags on that instead. The second kind
      # was hiding Compaction::Source's entire eleven-tag constructor docstring on
      # an attr_reader.
      #
      # `--staged` rather than whole-tree on purpose: 58 duplicate-namespace cases
      # predate this hook, and gating every commit on clearing them first would
      # block work that has nothing to do with them. Staged mode holds new work to
      # the standard from today and lets the backlog be cleared on its own terms.
      # `types: [ruby]` keeps it out of the way of commits touching no Ruby.
      - id: yard-lint
        name: yard-lint (staged ruby files)
        entry: bundle exec yard-lint --staged
        language: system
        types: [ruby]
        pass_filenames: false

      # Was a spec globbing planning/specs/*.md, which made prose part of the
      # test surface: one bad block turned `rake pspec` red for everyone, and
      # each new doc moved the example count this repo reads to detect a
      # truncated parallel run. Staged files only, so the signal reaches the
      # person editing the document rather than the next person to commit.
      - id: gherkin-docs
        name: gherkin blocks (staged plan docs)
        entry: bin/lint-gherkin-docs
        language: script
        files: '^planning/specs/.*\.md$'

      # Deterministic commit-message lint (no gem load, no network, no AI): the
      # mechanical parts of the git-commit-narrative standard. Runs at commit-msg
      # so it sees the final message; pass_filenames hands it COMMIT_EDITMSG.
      - id: lint-commit-msg
        name: lint commit message
        entry: bin/lint-commit-msg
        language: script
        stages: [commit-msg]

      # The price table is a hand-maintained copy of somebody else's published
      # rates, so it goes stale silently and a stale rate is a wrong cost on
      # every report derived from it. Nothing here checks the NUMBERS -- only
      # that a human has re-read them inside the review horizon. A repo lint,
      # not a runtime check: PriceBook must not consult a clock.
      - id: lint-price-freshness
        name: price table freshness (90-day review horizon)
        entry: bin/lint-price-freshness
        language: script
        pass_filenames: false

      # lib/ shells out through Lain::Shell::Out alone. Text, not an AST, because a
      # stale comment or a require claims the gem is still a dependency as much as
      # a constant does.
      - id: no-mixlib
        name: lib/ names mixlib nowhere
        language: pygrep
        entry: '(?i)mixlib'
        files: '^lib/'
        exclude: '\.so$'

      - id: no-spec-under-fixtures
        name: no collectible spec under spec/fixtures
        language: fail
        entry: 'a spec planted under spec/fixtures/ would run as part of the suite'
        files: '^spec/fixtures/.*_(spec|test)\.rb$'
