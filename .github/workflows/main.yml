name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

# main is committed to directly, so every push's own result is the signal: a
# per-sha group keeps main runs from being cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One list for the save and both restores: the path set is part of a cache
# entry's identity, so a restore naming a different set never hits.
env:
  BUILD_CACHE_PATHS: |
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    target/release/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          # 4.0.6 is the FLOOR, not a preference: 4.0.5 aborts the VM
          # intermittently under parallel specs (Bug #22072, "should have cvar
          # cache entry" -- rb_cvar_set drops the class-variable cache table in
          # a multi-Ractor process). Keep this in step with .ruby-version.
          - '4.0.9'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        id: toolchain
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # The action's own save runs before anything is built and then owns
          # the key, so target/ was never cached; the steps below replace it.
          cargo-cache: false
          rubygems: '4.0.3'
      # Cargo's fingerprints decide what rebuilds; the key only scopes a
      # restore to the image and Ruby the C objects and rb-sys bindings saw.
      - name: Name the compiled-build cache
        id: build-cache
        run: echo "prefix=cargo-release-$ImageOS-ruby$(ruby -e 'print RUBY_VERSION')-rustc$(rustc -V | cut -d' ' -f2)-" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo registry and compiled target/
        id: build-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.prefix }}${{ steps.toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}
      - name: Restore the spec runtime log
        uses: actions/cache/restore@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.sha }}
          restore-keys: rspec-runtime-
      - name: Install the editor and multiplexer the suite drives
        uses: ./.github/actions/spec-binaries
      # `.envrc`'s 12 is a measurement taken on an 8-physical-core developer
      # box (docs/spec-suite-performance.md); this repo is public, so
      # GitHub's ubuntu-latest here is its 4-vCPU/16GB standard runner, not
      # that box -- different, unmeasured hardware, so 12 does not transfer.
      # It is NOT left unset either: `Rakefile:76-84`'s fallback counts
      # unique PHYSICAL core ids from `lscpu -p=core`, and on a 4-vCPU
      # runner that resolves to at best 3 and possibly 1, depending on SMT
      # this box has not measured -- either way below the runner's own
      # core count and at or near what docs/spec-suite-performance.md calls
      # "the worst count tried." `nproc` -- logical count, read fresh at
      # job time -- is the runner's own measurement rather than a pin or an
      # accidental collapse toward serial. This also deliberately skips the
      # Rakefile's own `- 1` headroom: that subtraction is a floor for
      # hardware nobody has measured, chosen because guessing high risks an
      # OOM that `parallel_tests` reports as a pass -- but docs/spec-suite-
      # performance.md measured this asymmetry on an 8-physical/16-logical
      # box and found the optimum ABOVE the logical count (12-14), so
      # subtracting for headroom is the policy that measurement repudiates
      # on hardware anyone has actually measured. At 4 workers on 16GB
      # there is no OOM risk to hedge against -- this 8-core box runs 12 in
      # the same memory. Do not "restore consistency" with `- 1` here.
      - name: Size the parallel suite from the runner's own cores
        run: echo "LAIN_SPEC_WORKERS=$(nproc)" >> "$GITHUB_ENV"
      # rubocop runs in the lint job so it is off this job's critical path.
      - name: Compile the extension and the fence
        run: bundle exec rake compile
      # Without Landlock in the LSM list every gated egress probe skips, and a
      # green run proves only the seccomp layer.
      - name: Report the kernel's confinement layers
        run: uname -r; cat /sys/kernel/security/lsm; target/release/lain-fence --status
      - name: Run the parallel suite
        run: bundle exec rake pspec
      # The suite excludes :core and skips :daemon without a binary; LAIN_REQUIRE_BINARIES makes an absent one a failure.
      - name: Run the daemon tier
        env:
          LAIN_REQUIRE_BINARIES: '1'
        run: bundle exec rake daemon:build core:build && bundle exec rspec --tag core --tag daemon
      # Saved on a red suite too, but only once the extension linked: an entry
      # is immutable, so a half-built target/ would hold the key until evicted.
      - name: Save the cargo registry and compiled target/
        if: >-
          !cancelled() && github.ref == 'refs/heads/main'
          && steps.build-cache-restore.outputs.cache-hit != 'true'
          && hashFiles('lib/lain/lain.so') != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.prefix }}${{ steps.toolchain.outputs.cache-key }}
      - name: Save the spec runtime log
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    name: pre-commit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        id: toolchain
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
          cargo-cache: false
          rubygems: '4.0.3'
      - name: Name the compiled-build cache
        id: build-cache
        run: echo "prefix=cargo-release-$ImageOS-ruby$(ruby -e 'print RUBY_VERSION')-rustc$(rustc -V | cut -d' ' -f2)-" >> "$GITHUB_OUTPUT"
      # Restore only: the build job is the one writer.
      - name: Restore the cargo registry and compiled target/
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.prefix }}${{ steps.toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The cargo-deny hook is `language: system`; the runner image does not ship it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      # gherkin-docs `require "lain"`s, needing the compiled extension that
      # the skipped `ruby-checks` hook used to build on its way past.
      - name: Compile the Rust extension
        run: bundle exec rake compile
      # ext/lain needs a macOS SDK to type-check, so only the pure crates are covered here.
      - name: Type-check the Linux-gated crates for macOS
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin --all-targets -p lain-wire -p lain-core -p lain-fence
      # `ruby-checks` would run the suite a second time; rubocop, its other
      # half, runs on its own below.
      # The remote-* hooks need WebKitGTK; the remote-app job runs them on a runner that has it.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: ruby-checks,remote-fmt,remote-clippy,remote-test,remote-deny
      # A failed hook above must not hide rubocop's own verdict.
      - name: RuboCop
        if: ${{ !cancelled() }}
        run: bundle exec rubocop --parallel

  # A workflow-level paths filter would skip every job; only the sweep is gated on its inputs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mutants: ${{ steps.diff.outputs.mutants }}
      remote: ${{ steps.diff.outputs.remote }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a force push has no usable base; run everything rather than skip.
          touched() {
            if [ -z "${changed+set}" ] || grep -Eq "$2" <<< "$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) || unset changed
          touched mutants '^(ext/lain/|Rakefile$)'
          touched remote '^(apps/lain-remote/|crates/lain-(wire|rpc|daemon)/|Cargo\.(toml|lock)$|\.github/workflows/main\.yml$)'

  remote-app:
    # Dioxus and WebKitGTK are a long cold build, so it runs only when the app, the wire or the relay changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.remote == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    name: lain-remote
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        id: toolchain
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0.9'
          cargo-cache: false
          rubygems: '4.0.3'
      - name: Install the WebKitGTK and xdo headers dioxus-desktop links
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libxdo-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/
            apps/lain-remote/target/
          key: remote-${{ runner.os }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Cargo.lock', 'apps/lain-remote/Cargo.lock') }}
          restore-keys: remote-${{ runner.os }}-${{ steps.toolchain.outputs.cache-key }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Run the app's hooks
        run: |
          for hook in remote-fmt remote-clippy remote-test remote-deny; do
            pipx run pre-commit run --all-files "$hook"
          done

  remote-android:
    # The runner image already carries the SDK, an NDK and JDK 17; apps/lain-remote/bin/android-setup installs them locally.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.remote == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    name: lain-remote android
    timeout-minutes: 40
    env:
      APP: apps/lain-remote
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/lain-remote/target/
          key: android-${{ runner.os }}-${{ hashFiles('apps/lain-remote/Cargo.lock') }}
          restore-keys: android-${{ runner.os }}-
      - name: Install the Dioxus CLI the app's Cargo.lock pins
        run: |
          version=$(awk '/^name = "dioxus"$/ { getline; gsub(/version = |"/, ""); print; exit }' "$APP/Cargo.lock")
          echo "DIOXUS_CLI=dioxus-cli@$version" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.DIOXUS_CLI }}
      - name: Build the APK
        working-directory: ${{ env.APP }}
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64 NDK_HOME=$ANDROID_NDK_LATEST_HOME
          dx build --platform android --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: lain-remote-debug-apk
          path: ${{ env.APP }}/target/dx/lain-remote/debug/android/app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  mutants:
    # 13 minutes, so it runs only when ext/lain/ (the baseline included) or the Rakefile changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mutants == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
          rubygems: '4.0.3'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutation sweep
        run: bundle exec rake rust:mutants
