name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

# main is committed to directly, so every push's own result is the signal: a
# per-sha group keeps main runs from being cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One list for the save and both restores: the path set is part of a cache
# entry's identity, so a restore naming a different set never hits.
env:
  BUILD_CACHE_PATHS: |
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    target/release/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          # 4.0.6 is a FLOOR, not a preference: 4.0.5 aborts the VM
          # intermittently under parallel specs (Bug #22072, "should have cvar
          # cache entry" -- rb_cvar_set drops the class-variable cache table in
          # a multi-Ractor process). Keep this in step with .ruby-version.
          - '4.0.6'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        id: toolchain
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # The action's own save runs before anything is built and then owns
          # the key, so target/ was never cached; the steps below replace it.
          cargo-cache: false
          rubygems: '4.0.3'
      # Cargo's fingerprints decide what rebuilds; the key only scopes a
      # restore to the image and Ruby the C objects and rb-sys bindings saw.
      - name: Name the compiled-build cache
        id: build-cache
        run: echo "prefix=cargo-release-$ImageOS-ruby$(ruby -e 'print RUBY_VERSION')-rustc$(rustc -V | cut -d' ' -f2)-" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo registry and compiled target/
        id: build-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.prefix }}${{ steps.toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}
      - name: Restore the spec runtime log
        uses: actions/cache/restore@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.sha }}
          restore-keys: rspec-runtime-
      - name: Install the editor and multiplexer the suite drives
        uses: ./.github/actions/spec-binaries
      # `.envrc`'s 12 is a measurement taken on an 8-physical-core developer
      # box (docs/spec-suite-performance.md); this repo is public, so
      # GitHub's ubuntu-latest here is its 4-vCPU/16GB standard runner, not
      # that box -- different, unmeasured hardware, so 12 does not transfer.
      # It is NOT left unset either: `Rakefile:76-84`'s fallback counts
      # unique PHYSICAL core ids from `lscpu -p=core`, and on a 4-vCPU
      # runner that resolves to at best 3 and possibly 1, depending on SMT
      # this box has not measured -- either way below the runner's own
      # core count and at or near what docs/spec-suite-performance.md calls
      # "the worst count tried." `nproc` -- logical count, read fresh at
      # job time -- is the runner's own measurement rather than a pin or an
      # accidental collapse toward serial. This also deliberately skips the
      # Rakefile's own `- 1` headroom: that subtraction is a floor for
      # hardware nobody has measured, chosen because guessing high risks an
      # OOM that `parallel_tests` reports as a pass -- but docs/spec-suite-
      # performance.md measured this asymmetry on an 8-physical/16-logical
      # box and found the optimum ABOVE the logical count (12-14), so
      # subtracting for headroom is the policy that measurement repudiates
      # on hardware anyone has actually measured. At 4 workers on 16GB
      # there is no OOM risk to hedge against -- this 8-core box runs 12 in
      # the same memory. Do not "restore consistency" with `- 1` here.
      - name: Size the parallel suite from the runner's own cores
        run: echo "LAIN_SPEC_WORKERS=$(nproc)" >> "$GITHUB_ENV"
      # rubocop runs in the lint job so it is off this job's critical path.
      - name: Compile and run the parallel suite
        run: bundle exec rake compile pspec
      # Saved on a red suite too, but only once the extension linked: an entry
      # is immutable, so a half-built target/ would hold the key until evicted.
      - name: Save the cargo registry and compiled target/
        if: >-
          !cancelled() && github.ref == 'refs/heads/main'
          && steps.build-cache-restore.outputs.cache-hit != 'true'
          && hashFiles('lib/lain/lain.so') != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.prefix }}${{ steps.toolchain.outputs.cache-key }}
      - name: Save the spec runtime log
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    name: pre-commit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        id: toolchain
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          cargo-cache: false
          rubygems: '4.0.3'
      - name: Name the compiled-build cache
        id: build-cache
        run: echo "prefix=cargo-release-$ImageOS-ruby$(ruby -e 'print RUBY_VERSION')-rustc$(rustc -V | cut -d' ' -f2)-" >> "$GITHUB_OUTPUT"
      # Restore only: the build job is the one writer.
      - name: Restore the cargo registry and compiled target/
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.prefix }}${{ steps.toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The cargo-deny hook is `language: system`; the runner image does not ship it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # gherkin-docs `require "lain"`s, needing the compiled extension that
      # the skipped `ruby-checks` hook used to build on its way past.
      - name: Compile the Rust extension
        run: bundle exec rake compile
      # `ruby-checks` would run the suite a second time; rubocop, its other
      # half, runs on its own below.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: ruby-checks
      # A failed hook above must not hide rubocop's own verdict.
      - name: RuboCop
        if: ${{ !cancelled() }}
        run: bundle exec rubocop --parallel

  # A workflow-level paths filter would skip every job; only the sweep is gated on its inputs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mutants: ${{ steps.diff.outputs.mutants }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a force push has no usable base; sweep rather than skip.
          if ! changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null); then
            echo "mutants=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^(ext/lain/|Rakefile$)' <<< "$changed"; then
            echo "mutants=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutants=false" >> "$GITHUB_OUTPUT"
          fi

  mutants:
    # 13 minutes, so it runs only when ext/lain/ (the baseline included) or the Rakefile changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mutants == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          rubygems: '4.0.3'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutation sweep
        run: bundle exec rake rust:mutants
