name: Install spec binaries
description: >
  Installs and asserts the binaries the suite drives (nvim, tmux, jq, bwrap,
  strace), and asserts that bwrap can build lain's reader namespace.

inputs:
  neovim-version:
    description: >
      A neovim release tag, or "stable". Kept as a moving "stable" on purpose:
      the :nvim specs drive nvim over msgpack-RPC, so CI tracking the same
      release a developer has is worth more here than pinning a tag that slowly
      drifts away from every dev box. Pin it if a release ever breaks the suite.
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Install and assert the suite's binaries
      shell: bash
      env:
        NEOVIM_VERSION: ${{ inputs.neovim-version }}
      run: bin/ci/install-spec-binaries "$NEOVIM_VERSION"
