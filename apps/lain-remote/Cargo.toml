[package]
name = "lain-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: see the root Cargo.toml.
[workspace]

[lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
lain-wire = { path = "../../crates/lain-wire", version = "0.1.0" }
futures-util = { version = "0.3", default-features = false }
rmpv = "1.3"
serde = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
blake3 = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "test-util"] }

[profile.dev.package."*"]
opt-level = 2
