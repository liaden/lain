# This Cargo.toml is here to let externals tools (IDEs, etc.) know that this is
# a Rust project. Your extensions dependencies should be added to the Cargo.toml
# in the ext/ directory.

[workspace]
members = ["./ext/lain", "./crates/lain-core", "./crates/lain-fence", "./crates/lain-rpc", "./crates/lain-wire"]
# The phone app is a workspace of its own, so Dioxus and WebKitGTK stay out of this lockfile, this
# deny config, and what rust-analyzer loads for lain.
exclude = ["./apps/lain-remote"]
resolver = "2"
