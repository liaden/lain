# The prompt lain ships with, written in the format language `ext/lain/src/prompt.rs`
# implements (starship's, four productions). Compiled once at chat start and
# rendered per prompt, in process -- there is no fork/exec behind this file, and
# nothing here may cause one.
#
# Never name this file on a `rubocop` command line, not even to lint it. RuboCop
# has no TOML grammar and will parse `format = "..."` as Ruby, "fixing"
# Lint/UselessAssignment by deleting the `format = ` prefix -- verified, and it
# leaves a bare string literal that is no longer valid TOML. An `AllCops:
# Exclude` entry does NOT save you here: Exclude governs RuboCop's own file
# DISCOVERY, not a path handed to it directly on the command line -- also
# verified. A bare `bundle exec rubocop` / `pre-commit run --all-files` (the
# shapes CI and the git hook actually use) never walks into this file and is
# safe.
#
# A project overrides it with `.lain/prompt.toml`; a machine, with
# `$XDG_CONFIG_HOME/lain/prompt.toml`. The narrowest scope that answered wins.
#
# Every variable is optional. A `( ... )` group elides when every variable inside
# it is empty, so a chat with no turn behind it and no subagent spawned composes
# nothing at all and the prompt is exactly today's.
#
# What `Lain::Frontend::PromptComposer::RunState` supplies:
#
#   $model      the live model slot -- follows a /model switch mid-chat
#   $occupancy  how full the context window is, a whole percent, clamped at 100%,
#               prefixed `~` when nothing vouched for the window (`~61%`)
#               (absent before the first turn, and absent when the model slot is
#               blank -- a prompt is not the place to answer for a wiring bug)
#   $fleet      how many subagents have spawned, absent when none have
#   $idle       since the human last answered a prompt: 12s, 5m, 2h. Absent
#               while a dispatch is in flight: it counts time since the human
#               TYPED, which describes the run only while nothing is running,
#               so a `human>` prompt opened by a parked ask_human would
#               otherwise read "idle 0s" mid-turn. Keep it inside a group, as
#               below -- the group is what takes the literal word "idle" with
#               the reading; ungrouped, an absent reading strands it.
#   $compaction the reading "stalled", and nothing else, once
#               `Compaction::Source::Derived` has refused that many derivations
#               in a ROW (it owns the threshold; ask `.stalled?`). Absent for a
#               healthy session, so the group elides and the prompt is exactly
#               today's. A stalled session is not broken -- it renders
#               uncompacted and keeps going -- but it stops shrinking, and
#               until this variable nothing said so. The streak's own count is
#               in the published state feed for a reader with room for a number.
#               It says no derivation has SUCCEEDED since that many refusals;
#               it does not say one was attempted this turn, and it clears only
#               when one succeeds. See RunState#compaction for why it latches.
#   $mode       the scope's and the approval's lighters, then every active
#               layer's, space separated -- e.g. "AUTO" or "AUTO AA". Absent
#               whenever there is nothing to say: no mode is wired yet, or the
#               session is in checkout ask, where it starts, with no layers
#               active. This is chrome the human cannot accidentally scroll
#               away or turn off, which is why it rides the composed line
#               above the editor rather than living only in the transcript.
#
# Colour is NOT resolved here. Ruby owns the stream, so it decides whether this
# renders with escape sequences at all; a `(bold cyan)` on a piped stdout emits
# plain bytes.
format = "[$model](bold cyan)( [$mode](bold yellow))( [compaction $compaction](bold red))( [ctx $occupancy](dim))( [fleet $fleet](dim))( [idle $idle](dim))"

# [settings]
# The composed line is dropped, rather than wrapped, when it is wider than the
# room it has -- a wrapped row above the cursor smears the moment anything
# redraws. That room is the terminal's own width unless this names a smaller one.
# max_width = 60
